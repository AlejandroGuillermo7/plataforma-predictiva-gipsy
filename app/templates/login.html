<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Gipsy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <div class="login">
    <h1>Gipsy</h1>
    <p>Análisis predictivo de compras</p>
    {% for categoria, texto in get_flashed_messages(with_categories=true) %}
      <div class="mensaje {{ categoria }}">{{ texto }}</div>
    {% endfor %}
    <form method="post">
      <label>Usuario <input name="usuario" required autofocus></label>
      <label>Contraseña <input name="contrasena" type="password" required></label>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
