<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Gipsy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">G</div>
        <h1>Gipsy</h1>
      </div>
      <p>Análisis predictivo de compras para la tienda.</p>

      {% for categoria, texto in get_flashed_messages(with_categories=true) %}
        <div class="mensaje {{ categoria }}">{{ texto }}</div>
      {% endfor %}

      <form method="post" class="login-form">
        <label class="field">
          Usuario
          <input name="usuario" required autofocus placeholder="admin">
        </label>
        <label class="field">
          Contraseña
          <input name="contrasena" type="password" required placeholder="••••••••">
        </label>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
